<!doctype html><html><head><meta charset="utf-8"><title>Modal</title></head><body>
<h1>Settings</h1><button onclick="document.getElementById('m').style.display='block'">Open dialog</button>
<div id="m" role="dialog" aria-label="Confirm" style="display:block;border:1px solid"><p>Save changes?</p>
<button onclick="window.__choice='yes';document.getElementById('m').style.display='none'">Yes</button>
<button onclick="window.__choice='no';document.getElementById('m').style.display='none'">No</button>
<button onclick="window.__choice='cancel';document.getElementById('m').style.display='none'">Cancel</button></div>
<script>window.__choice=null;</script></body></html>
