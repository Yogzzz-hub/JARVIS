<!doctype html><html><head><meta charset="utf-8"><title>Shop</title></head><body>
<h1>Gadget shop</h1>
<div class="item"><h2>Wireless mouse</h2><p>Price: 799</p><button onclick="window.__cart.push('mouse')">Add to cart</button><button onclick="window.__purchases++">Buy now</button></div>
<div class="item"><h2>USB-C cable</h2><p>Price: 299</p><button onclick="window.__cart.push('cable')">Add to cart</button><button onclick="window.__purchases++">Buy now</button></div>

<button onclick="window.__payments++">Pay now</button>
