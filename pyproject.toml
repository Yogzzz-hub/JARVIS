[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-edge"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.35,<1", "pydantic>=2.10,<3",
  "psutil>=6,<8", "mss>=10,<11", "pycaw>=20240210; sys_platform == 'win32'",
  "httptools>=0.6,<1", "websockets>=14,<17", "h11>=0.16,<1",
  "rapidfuzz>=3.0.0", "pyyaml>=6.0",
  "httpx>=0.28,<1", "numpy>=1.26,<3", "watchdog>=4,<7",
  "keyring>=25.0.0", "PySide6>=6.8.0",
]

[project.scripts]
jarvis = "jarvis.__main__:main"
jarvis-cli = "jarvis.cli:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
jarvis = ["config/*.toml", "db/migrations/*.sql", "core/router/*.yaml"]

[project.optional-dependencies]
voice = ["sounddevice>=0.5,<1", "scipy>=1.12,<2", "faster-whisper>=1.2,<2", "openwakeword>=0.6,<0.7", "silero-vad-lite>=0.2,<0.3", "piper-tts>=1.3,<2", "keyboard>=0.13,<1", "pyttsx3>=2.90,<3; sys_platform == 'win32'"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "playwright>=1.50,<2", "Pillow>=11,<13", "tzdata", "google-api-python-client>=2,<3"]
windows = ["uiautomation>=2,<3", "pywin32>=306; sys_platform == 'win32'", "sounddevice>=0.5,<1", "pyautogui>=0.9.54,<1", "pyperclip>=1.8,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["legacy_holdout: legacy generalization hold-out checks"]
