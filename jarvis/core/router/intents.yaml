intents:
  - name: open_app
    tool: open_app
    risk: REVERSIBLE
    required_slots: ["name"]
    optional_slots: []
    patterns:
      - "^open (?P<name>.+)$"
      - "^start (?P<name>.+)$"
      - "^launch (?P<name>.+)$"
      - "^bring up (?P<name>.+)$"
      - "^run (?P<name>.+)$"
    keywords: ["open", "start", "launch", "bring up", "run"]
    examples:
      - "open chrome"
      - "start vscode"
      - "launch calculator"
      - "bring up notepad"
      - "open terminal"
      - "run powershell"
    negative_examples:
      - "can chrome open pdf files"
      - "don't open chrome"
      - "why is chrome slow"
      - "is chrome installed"
      - "what is chrome"
      - "how do i open chrome"
    aliases:
      chrome: ["google chrome", "browser"]
      vscode: ["vs code", "visual studio code", "code"]
      notepad: ["text editor"]
      calculator: ["calc"]
      cmd: ["command prompt"]
      terminal: ["windows terminal"]
    fuzzy_allowed: true
    fuzzy_threshold: 80.0
    ambiguity_margin: 10.0
    lane0_enabled: true
    lane0_threshold: 0.85
    lane1_threshold: 0.70

  - name: close_app
    tool: close_app
