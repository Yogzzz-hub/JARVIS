    keywords: ["close", "quit", "kill", "exit"]
    examples:
      - "close chrome"
      - "quit notepad"
      - "kill terminal"
    negative_examples:
      - "why did chrome close"
      - "don't close chrome"
    aliases: {}
    fuzzy_allowed: true
    fuzzy_threshold: 85.0
    ambiguity_margin: 12.0
    lane0_enabled: true
    lane0_threshold: 0.90
    lane1_threshold: 0.75

