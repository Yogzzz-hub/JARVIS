<!doctype html><html lang="en"><meta charset="utf-8"><title>JARVIS Voice / Language</title>
<style>body{background:#101924;color:#e7edf5;font:16px system-ui;margin:32px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}section{background:#1b293b;border-radius:12px;padding:18px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}a{color:#74d7ff}</style>
<h1>Voice / Language</h1><p id="state">Connecting…</p><p><a href="/dashboard/voice-benchmark/page">Owner microphone and listening test</a> · <a href="http://127.0.0.1:8766">NLP shadow review</a></p><main id="cards"></main>
<script>
async function update(){try{const r=await fetch('/dashboard/voice-language');if(!r.ok)throw Error('Status unavailable');const d=await r.json();document.querySelector('#state').textContent=d.deployment+' · '+d.voice_acceptance+' · Production authoritative · Candidate execution OFF';const cards=document.querySelector('#cards');cards.replaceChildren();for(const key of ['wake','microphone','microphone_details','vad','stt','latest_transcript','production_route','session','benchmark','language','capability_brain','tts','speaker','barge_in','whatsapp_bridge','google_auth','phone_bridge','shadow']){const card=document.createElement('section');const title=document.createElement('h2');title.textContent=key.replaceAll('_',' ');const value=document.createElement('pre');value.textContent=JSON.stringify(d[key],null,2);card.append(title,value);cards.append(card)}}catch(e){document.querySelector('#state').textContent='Backend unavailable. Other components may still be active.'}}
update();setInterval(update,4000);
</script></html>
