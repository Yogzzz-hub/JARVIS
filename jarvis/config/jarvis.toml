[server]
host = "127.0.0.1"
port = 8765
workers = 1
http_backend = "httptools"
ws_backend = "websockets-sansio"
ws_compression = false
access_log = false

[performance]
event_queue_size = 1024
persistence_queue_size = 4096
metric_queue_size = 4096
verify_poll_ms = 50
verify_timeout_ms = 3000

[database]
journal_mode = "WAL"
synchronous = "NORMAL"
busy_timeout_ms = 3000

[paths]
db = "db/jarvis.db"
logs = "logs/jarvis.jsonl"
models = "models"

[features]
router_ai = true
planner = true
voice = true
tts = true
phone = true
google = true
browser = true
vision = true

[models]
# Ollama model roles. If a configured model is not pulled, JARVIS automatically
# uses the best installed alternative (see `python -m jarvis.diagnostics`).
# Each role lists models best-first; the first one that is pulled is used.
# Engine plan: exact commands -> no model; routing -> JDE (+ MiniLM/BGE-small); slightly uncertain intent -> fast;
# normal planning / chat -> planner/chat; hard planning -> deep (only when installed); screen -> vision (on demand).
fast = "qwen3.5:2b, qwen3.5:0.8b, qwen3:1.7b"        # uncertain-intent fallback: tiny and quick
planner = "qwen3.5:4b, llama3.2:latest"             # normal multi-step planning and the tool-using agent
chat = "qwen3.5:4b, llama3.2:latest"                # conversation, RAG answers, WhatsApp replies
vision = "qwen3.5:4b, qwen2.5vl:3b, moondream"                 # screen understanding (multimodal), loaded only on demand
deep = "qwen3.6:35b-a3b"                            # hard planning/reasoning only; never pulled automatically
embed = "nomic-embed-text"  # RAG embeddings (optional; lexical search works without it)
base_url = "http://127.0.0.1:11434"
keep_alive = "30m"
timeout_s = 60.0
num_ctx = 4096
auto_start = true           # start `ollama serve` automatically when it is not running
warm_on_start = true        # preload the fast model so the first command is quick

[decision]
# JARVIS Decision Engine (local, offline). "shadow" = the existing router acts, JDE only logs to
# data/jde/shadow.jsonl. "read_only" = stage B (unmatched plain questions go to chat, not the agent).
# "off" = JDE not loaded. Default: read_only (plain questions skip the slower agent). See README.md, section 6.
stage = "read_only"

[aliases]
# Additional aliases must be absolute existing executable paths.

[voice]
device = "default"
wake_enabled = true
ptt_enabled = true
model_path = "models/wake/hey_jarvis_v0.1.onnx"
threshold = 0.5   # openWakeWord hey_jarvis: lower = easier to wake (more false wakes), higher = stricter
language = "thanglish"     # "thanglish" = understands English and Thanglish (multilingual model); "english" = English only
stt_model = "auto"  # auto = large-v3-turbo on an NVIDIA GPU (best accuracy), small.en on the CPU; or a size/path
stt_device = "auto"        # use the NVIDIA GPU when available, else the CPU
compute_type = "int8"
stt_beam_size = 5          # final-pass accuracy (lower = faster on slow CPUs)
preroll_ms = 500
endpoint_silence_ms = 800  # pause that ends your turn; unfinished sentences get about twice as long
max_utterance_s = 45       # longest single request
wake_ack = "chime"         # "chime" | "voice" | "none" - response to "Hey Jarvis"
