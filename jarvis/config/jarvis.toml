[server]
host = "127.0.0.1"
port = 8765
workers = 1
http_backend = "httptools"
ws_backend = "websockets-sansio"
ws_compression = false
access_log = false

[performance]
event_queue_size = 1024
persistence_queue_size = 4096
metric_queue_size = 4096
verify_poll_ms = 50
verify_timeout_ms = 3000

[database]
journal_mode = "WAL"
synchronous = "NORMAL"
busy_timeout_ms = 3000

[paths]
db = "db/jarvis.db"
logs = "logs/jarvis.jsonl"
models = "models"

[features]
router_ai = true
planner = true
voice = true
tts = true
phone = false
google = false
browser = true
vision = false

[models]
# Ollama model roles. If a configured model is not pulled, JARVIS automatically
# uses the best installed alternative (see `python -m jarvis.diagnostics`).
fast = "qwen3:1.7b"        # intent classification / slot extraction (small = fast)
planner = "llama3.2:latest" # multi-step plans and the tool-using agent
chat = "llama3.2:latest"    # conversation, RAG answers, WhatsApp replies
vision = "qwen2.5vl:3b"
embed = "nomic-embed-text"  # RAG embeddings (optional; lexical search works without it)
base_url = "http://127.0.0.1:11434"
keep_alive = "30m"
timeout_s = 60.0
num_ctx = 4096
auto_start = true           # start `ollama serve` automatically when it is not running
warm_on_start = true        # preload the fast model so the first command is quick

[aliases]
# Additional aliases must be absolute existing executable paths.

[voice]
device = "default"
wake_enabled = true
ptt_enabled = true
model_path = "models/wake/hey_jarvis_v0.1.onnx"
threshold = 0.5   # openWakeWord hey_jarvis: lower = easier to wake (more false wakes), higher = stricter
stt_model = "models/whisper/base"
stt_device = "cpu"
compute_type = "int8"
preroll_ms = 500
