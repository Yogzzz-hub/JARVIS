[server]
host = "127.0.0.1"
port = 8765
workers = 1
http_backend = "httptools"
ws_backend = "websockets-sansio"
ws_compression = false
access_log = false

[performance]
event_queue_size = 1024
persistence_queue_size = 4096
metric_queue_size = 4096
verify_poll_ms = 50
verify_timeout_ms = 3000

[database]
journal_mode = "WAL"
synchronous = "NORMAL"
busy_timeout_ms = 3000

[paths]
db = "db/jarvis.db"
logs = "logs/jarvis.jsonl"
models = "models"

[features]
router_ai = true
planner = true
voice = true
tts = true
phone = false
google = false
browser = true
vision = false

[models]
fast = "qwen3:0.6b"
planner = "qwen3:1.7b"
vision = "qwen3-vl:2b"

[aliases]
# Additional aliases must be absolute existing executable paths.

[voice]
device = "default"
wake_enabled = true
ptt_enabled = true
model_path = "models/wake/hey_jarvis_v0.1.onnx"
threshold = 0.55
stt_model = "models/whisper/base"
stt_device = "cpu"
compute_type = "int8"
preroll_ms = 500
